<!DOCTYPE html>

<head>

  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Rubik', sans-serif;
      background: radial-gradient(circle at 50% 15%, #161038 0%, #09071a 48%, #04030d 100%);
      color: #ffffff;
      overflow-x: hidden;
      min-height: 100vh;
      margin: 0;
    }
    .laser-container { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .laser { position: absolute; top: -15%; width: 6px; height: 145vh; transform-origin: top center; filter: blur(4px); opacity: 0.55; mix-blend-mode: screen; }
    .l1 { left: 10%; background: linear-gradient(to bottom, #00f5d4, rgba(0,245,212,0)); animation: beam1 6.5s ease-in-out infinite alternate; }
    .l2 { left: 32%; background: linear-gradient(to bottom, #ff007f, rgba(255,0,127,0)); animation: beam2 8s ease-in-out infinite alternate; }
    .l3 { left: 50%; background: linear-gradient(to bottom, #a3ff12, rgba(163,255,18,0)); animation: beam3 7s ease-in-out infinite alternate; }
    .l4 { left: 68%; background: linear-gradient(to bottom, #00bbf9, rgba(0,187,249,0)); animation: beam1 9s ease-in-out infinite alternate-reverse; }
    .l5 { left: 90%; background: linear-gradient(to bottom, #f15bb5, rgba(241,91,181,0)); animation: beam2 6s ease-in-out infinite alternate-reverse; }
    @keyframes beam1 { 0% { transform: rotate(-34deg) scaleX(1); } 100% { transform: rotate(28deg) scaleX(2.4); } }
    @keyframes beam2 { 0% { transform: rotate(32deg) scaleX(1.2); } 100% { transform: rotate(-26deg) scaleX(2); } }
    @keyframes beam3 { 0% { transform: rotate(-20deg) scaleX(1.5); } 100% { transform: rotate(22deg) scaleX(2.6); } }
    .star { position: fixed; pointer-events: none; z-index: 0; animation: twinkle 3s ease-in-out infinite alternate; }
    @keyframes twinkle { 0% { transform: scale(0.75) rotate(0deg); opacity: 0.45; } 100% { transform: scale(1.25) rotate(25deg); opacity: 1; } }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .vinyl-spin { animation: spinSlow 14s linear infinite; }
    .chrome-title {
      background: linear-gradient(180deg, #ffffff 0%, #e0f2fe 38%, #7dd3fc 62%, #0284c7 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 0 #1e3a8a) drop-shadow(0 5px 0 #0f172a) drop-shadow(0 0 24px rgba(56, 189, 248, 0.75));
    }
    .chrome-number {
      background: linear-gradient(180deg, #ffffff 0%, #bae6fd 45%, #38bdf8 80%, #0369a1 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 0 #1e3a8a) drop-shadow(0 7px 0 #090d16) drop-shadow(0 0 30px rgba(0, 245, 212, 0.85));
    }
    .rave-yellow-title {
      background: linear-gradient(180deg, #fef08a 0%, #facc15 45%, #f97316 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 0 #7c2d12) drop-shadow(0 6px 0 #270c02) drop-shadow(0 0 26px rgba(250, 204, 21, 0.8));
    }
    .flyer-frame {
      background: linear-gradient(180deg, rgba(17, 15, 48, 0.92) 0%, rgba(8, 9, 26, 0.96) 100%);
      border: 2px solid rgba(0, 245, 212, 0.35);
      box-shadow: 0 0 50px rgba(139, 92, 246, 0.35), 0 0 90px rgba(0, 245, 212, 0.2), inset 0 0 40px rgba(255, 0, 127, 0.15);
    }
    .rsvp-hero-box {
      background: linear-gradient(135deg, rgba(163, 255, 18, 0.14) 0%, rgba(0, 245, 212, 0.12) 50%, rgba(15, 18, 45, 0.96) 100%);
      border: 2px solid #b5ff00;
      box-shadow: 0 0 32px rgba(181, 255, 0, 0.32), inset 0 0 20px rgba(181, 255, 0, 0.1);
    }
    .hazard-border {
      background: repeating-linear-gradient(-45deg, #090d16, #090d16 12px, #b5ff00 12px, #b5ff00 24px);
      box-shadow: 0 0 35px rgba(181, 255, 0, 0.55);
    }
    .dj-card-neftul { background: radial-gradient(circle at top, rgba(245, 158, 11, 0.25), rgba(15, 12, 30, 0.95)); border: 2px solid rgba(251, 191, 36, 0.65); box-shadow: 0 0 25px rgba(245, 158, 11, 0.25); }
    .dj-card-backman { background: radial-gradient(circle at top, rgba(6, 182, 212, 0.28), rgba(15, 12, 30, 0.95)); border: 2px solid rgba(34, 211, 238, 0.75); box-shadow: 0 0 28px rgba(34, 211, 238, 0.3); }
    .dj-card-insurance { background: radial-gradient(circle at top, rgba(236, 72, 153, 0.25), rgba(15, 12, 30, 0.95)); border: 2px solid rgba(244, 114, 182, 0.65); box-shadow: 0 0 25px rgba(236, 72, 153, 0.25); }
    .glass-panel { background: rgba(13, 15, 38, 0.88); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.14); }
    .hidden { display: none !important; }
    .max-w-2xl { max-width: 42rem; margin-left: auto; margin-right: auto; }
    .grid { display: grid; }
    .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .gap-2 { gap: 0.5rem; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .text-center { text-align: center; }
    .rounded-3xl { border-radius: 1.5rem; }
    .rounded-2xl { border-radius: 1rem; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-full { border-radius: 9999px; }
    .p-4 { padding: 1rem; }
    .p-5 { padding: 1.25rem; }
    .w-full { width: 100%; }
    .font-black { font-weight: 900; }
    .font-bold { font-weight: 700; }
    button { cursor: pointer; border: none; font-family: inherit; }
    input, select { font-family: inherit; }
    .tab-pill.active { background: linear-gradient(90deg, #b5ff00 0%, #00f5d4 100%); color: #050611; font-weight: 900; box-shadow: 0 0 20px rgba(181, 255, 0, 0.6); }
  </style>
</head>
<body class="pb-16">
  <div class="laser-container">
    <div class="laser l1"></div><div class="laser l2"></div><div class="laser l3"></div><div class="laser l4"></div><div class="laser l5"></div>
  </div>

  <svg width="28" height="28" class="star top-12 right-6 w-7 h-7 text-yellow-300" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/></svg>
  <svg width="24" height="24" class="star top-44 left-5 w-6 h-6 text-pink-400" style="animation-delay:0.8s" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/></svg>
  <svg width="32" height="32" class="star top-96 right-4 w-8 h-8 text-cyan-300" style="animation-delay:1.4s" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/></svg>
  <svg width="28" height="28" class="star bottom-32 left-6 w-7 h-7 text-lime-300" style="animation-delay:0.4s" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/></svg>

  <div class="relative z-10 max-w-2xl mx-auto px-3 sm:px-5 pt-4">
    <div class="flex items-center justify-between gap-2 mb-3 glass-panel rounded-full px-4 py-2 text-xs shadow-lg">
      <div class="flex items-center gap-2 font-extrabold text-lime-300">
        <span class="w-2.5 h-2.5 rounded-full bg-lime-400 animate-ping"></span>
        <span>קאווזה הפקות • הזמנה רשמית</span>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="shareWhatsapp()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-3.5 py-1.5 rounded-full transition shadow">שלח בוואטסאפ</button>
        <button type="button" onclick="copyShareLink()" id="copyBtn" class="bg-white/10 hover:bg-white/20 text-white font-bold px-3 py-1.5 rounded-full transition">העתק לינק</button>
      </div>
    </div>

    <main class="flyer-frame rounded-3xl p-4 sm:p-7 relative overflow-hidden">
      <header class="text-center relative z-10">
        <div class="text-sm sm:text-base font-extrabold tracking-widest text-cyan-200 mb-2">קאווזה הפקות מציגים:</div>
        <div class="inline-flex flex-col items-center justify-center bg-gradient-to-b from-emerald-950/90 to-slate-950/95 border-2 border-amber-400/80 rounded-2xl px-6 py-2.5 shadow-[0_0_30px_rgba(251,191,36,0.35)] mb-4">
          <svg width="48" height="48" class="w-12 h-12 text-emerald-400 drop-shadow-[0_0_8px_rgba(52,211,153,0.7)]" viewBox="0 0 64 64" fill="currentColor"><path d="M32 4L19 20h8L14 34h10L10 48h19v10h6V48h19L40 34h10L37 20h8L32 4z"/></svg>
          <div class="mt-0.5 px-2.5 py-0.5 rounded bg-amber-400/15 border border-amber-400/50 text-amber-300 font-black text-xs tracking-wider">קאווזה הפקות</div>
        </div>
        <h1 class="font-black leading-none select-none">
          <span class="block text-4xl sm:text-6xl chrome-title tracking-tight">חגיגות יומולדת</span>
          <span class="block text-6xl sm:text-8xl chrome-number mt-1">34 לזאבי</span>
        </h1>
        <div class="mt-4 mb-5 relative inline-block">
          <div class="absolute -inset-2 bg-gradient-to-r from-pink-500 via-amber-400 to-cyan-400 rounded-2xl blur-lg opacity-45"></div>
          <div class="relative bg-slate-950/85 border border-amber-300/40 rounded-2xl px-6 py-2">
            <span class="text-4xl sm:text-5xl font-black rave-yellow-title tracking-tight">מסיבת ריקודים</span>
          </div>
        </div>
      </header>

      <section class="mb-5">
        <div class="bg-slate-950/80 border border-cyan-400/30 rounded-2xl p-3 text-center shadow-inner">
          <div class="text-[11px] uppercase tracking-widest text-cyan-300 font-bold mb-2">⏳ ספירה לאחור לפתיחת הרחבה ⏳</div>
          <div class="grid grid-cols-4 gap-2">
            <div class="bg-gradient-to-b from-slate-900 to-slate-950 rounded-xl py-2 border border-lime-400/30"><div id="cd-days" class="text-2xl sm:text-3xl font-black text-lime-400">00</div><div class="text-[11px] text-slate-400 font-bold">ימים</div></div>
            <div class="bg-gradient-to-b from-slate-900 to-slate-950 rounded-xl py-2 border border-cyan-400/30"><div id="cd-hours" class="text-2xl sm:text-3xl font-black text-cyan-300">00</div><div class="text-[11px] text-slate-400 font-bold">שעות</div></div>
            <div class="bg-gradient-to-b from-slate-900 to-slate-950 rounded-xl py-2 border border-pink-400/30"><div id="cd-mins" class="text-2xl sm:text-3xl font-black text-pink-400">00</div><div class="text-[11px] text-slate-400 font-bold">דקות</div></div>
            <div class="bg-gradient-to-b from-slate-900 to-slate-950 rounded-xl py-2 border border-amber-400/30"><div id="cd-secs" class="text-2xl sm:text-3xl font-black text-amber-300">00</div><div class="text-[11px] text-slate-400 font-bold">שניות</div></div>
          </div>
        </div>
      </section>

      <section class="rsvp-hero-box rounded-3xl p-4 sm:p-5 mb-6 relative">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3 pb-3 border-b border-lime-400/25">
          <div>
            <div class="inline-block bg-lime-400 text-slate-950 text-[11px] font-black px-2.5 py-0.5 rounded-full mb-1">חשוב להיערכות האירוע!</div>
            <h2 class="text-xl sm:text-2xl font-black text-white">🎟️ אישור הגעה מהיר</h2>
            <p class="text-xs text-lime-200/90 mt-0.5">כדי שנדע להיערך בכמויות, בבר ובאווירה — תעדכנו אם אתם באים:</p>
          </div>
          <div class="bg-slate-950/95 border-2 border-lime-400 rounded-2xl px-4 py-2 text-center shadow-[0_0_20px_rgba(181,255,0,0.35)]">
            <div class="text-[10px] font-bold text-lime-300 uppercase">כבר אישרו הגעה</div>
            <div class="text-3xl font-black text-lime-400 leading-none my-0.5" id="rsvpCount">1</div>
            <div class="text-[10px] text-slate-300 font-bold">בליינים ברחבה</div>
          </div>
        </div>

        <form onsubmit="submitRsvp(event)" class="space-y-3 text-sm">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <div>
              <label class="block text-xs text-lime-200 mb-1 font-bold">שם מלא *</label>
              <input id="rsvpName" required type="text" placeholder="השם שלך..." class="w-full bg-slate-950/95 border border-lime-400/40 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-lime-300" />
            </div>
            <div>
              <label class="block text-xs text-lime-200 mb-1 font-bold">מגיע/ה?</label>
              <select id="rsvpStatus" class="w-full bg-slate-950/95 border border-lime-400/40 rounded-xl px-3 py-2.5 text-white font-bold">
                <option value="מגיע">מגיע/ה ברור! 🎉</option>
                <option value="אולי">אולי (מתארגן)</option>
                <option value="לא מגיע">לא אוכל להגיע</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-lime-200 mb-1 font-bold">כמה אתם?</label>
              <input id="rsvpGuests" type="number" min="1" max="10" value="1" class="w-full bg-slate-950/95 border border-lime-400/40 rounded-xl px-3 py-2.5 text-white font-bold" />
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1 font-bold">טרמפים / הערות (אופציונלי)</label>
            <input id="rsvpRide" type="text" placeholder="לדוגמה: יוצא מת״א עם 3 מקומות פנויים / מחפש טרמפ" class="w-full bg-slate-950/95 border border-white/15 rounded-xl px-3.5 py-2 text-white text-xs focus:outline-none focus:border-cyan-400" />
          </div>
          <button type="submit" id="rsvp
